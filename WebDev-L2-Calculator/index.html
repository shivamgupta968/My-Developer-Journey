<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive calculator built with HTML, CSS and JavaScript.">
  <title>OIBSIP | Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="topbar">
      <div>
        <p class="eyebrow">OIBSIP · WEB DEVELOPMENT</p>
        <h1>Calculator</h1>
      </div>
      <span class="status-dot" aria-label="Ready"></span>
    </header>

    <section class="display" aria-live="polite">
      <div id="expression" class="expression">Ready</div>
      <output id="result" class="result">0</output>
    </section>

    <section class="keys" aria-label="Calculator keys">
      <button class="key utility" data-action="clear">C</button>
      <button class="key utility" data-action="backspace" aria-label="Backspace">⌫</button>
      <button class="key operator" data-operator="÷">÷</button>
      <button class="key operator" data-operator="×">×</button>

      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key operator" data-operator="−">−</button>

      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key operator" data-operator="+">+</button>

      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key equals" data-action="equals">=</button>

      <button class="key zero" data-number="0">0</button>
      <button class="key" data-action="decimal">.</button>
    </section>
    <p id="message" class="message" role="status">Use the buttons or your keyboard.</p>
    <footer>Built for Oasis Infobyte Internship · Level 2 · Task 1</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
